    server_name _;

    include /etc/nginx/conf.d/real_ip.conf;

    # Docker's embedded DNS server, used by the lazy PocketBase proxy below.
    #
    # nginx resolves a LITERAL upstream host at configuration-load time, so a
    # `proxy_pass http://pocketbase:8090;` line makes nginx abort startup with
    # `host not found in upstream` whenever the pocketbase service is not
    # running. PocketBase sits behind an opt-in Compose profile, so it is
    # normally absent -- which put nginx in a restart loop that took the whole
    # site down on any restart. Using a variable in proxy_pass defers resolution
    # to request time, so an absent PocketBase now yields a 502 for that one
    # endpoint instead of preventing the server from booting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), autoplay=(self \"https://www.youtube.com\" \"https://www.youtube-nocookie.com\")" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://cdn.discordapp.com https://i.scdn.co; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://open.spotify.com https://challenges.cloudflare.com; connect-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://cloudflareinsights.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # Crawler user agents that get server-rendered HTML from the backend instead
    # of the SPA shell (social + AI/LLM agents). The $is_bot map lives in
    # nginx.conf (http context).
    #
    # Social crawlers get the OG page; AI/LLM agents (GPTBot, ClaudeBot,
    # PerplexityBot, etc.) get the same server-rendered page with JSON-LD.

    # Uploads (from backend)
    location /uploads/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ACME HTTP-01 challenges (served by the backend)
    location /.well-known/acme-challenge/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO / agent-browsing files are generated by the backend (robots.txt,
    # sitemap.xml, llms.txt, llms-full.txt).
    location = /robots.txt {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sub-sitemaps used by the sitemap index when there are >50k public profiles.
    location ~ ^/sitemap-\d+\.xml$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms-full.txt {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic branding OG image (rendered by the backend from APP_NAME/APP_TAGLINE).
    location = /og.png {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom-domain roots: social crawlers hitting the ROOT of a non-app host
    # get server-rendered OG from the backend (custom-domain profile or landing).
    location = / {
        if ($is_bot = "1") {
            set $og_root 1;
        }
        if ($is_app_host = "1") {
            set $og_root 0;
        }
        if ($og_root = "1") {
            proxy_pass http://backend;
            break;
        }
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # PocketBase (optional: the sign-in provider only). Proxied same-origin so the
    # browser never talks to PocketBase directly — no port is exposed and no CORS
    # is needed, and the sign-in form posts credentials to PB through us rather
    # than to a third-party origin. The trailing slash on proxy_pass strips the
    # /api/pb-speed/ prefix, so /api/pb-speed/api/collections/... reaches PB as
    # /api/collections/...
    #
    # Only the auth endpoints are reachable from the browser in practice. The
    # former analytics module posted visitor events straight to PB through this
    # proxy; it was removed because PostgreSQL already owned that data, and with
    # it went the unauthenticated public write surface this proxy used to expose.
    location /api/pb-speed/ {
        # Strip the /api/pb-speed/ prefix ourselves and hand nginx a variable
        # upstream, because `proxy_pass` with a variable cannot also carry the
        # URI part that performs the prefix strip.
        rewrite ^/api/pb-speed/(.*)$ /$1 break;

        set $pb_upstream http://pocketbase:8090;
        proxy_pass $pb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API routes
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Social crawlers (Discord, X/Twitter, Facebook, Telegram, etc.) and AI/LLM
    # agents requesting a profile URL get server-rendered HTML from the backend
    # instead of the SPA shell.
    location / {
        if ($is_bot = "1") {
            set $og_backend 1;
        }
        if ($request_uri !~ "^/[^/]+/?$") {
            set $og_backend 0;
        }
        if ($og_backend = "1") {
            proxy_pass http://backend;
            break;
        }
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $xff_addr;
        proxy_set_header X-Forwarded-For $xff_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
