events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client IP forwarded to the backend.
    #
    # Trust boundary: nginx trusts X-Forwarded-For only from the sources listed in
    # conf.d/real_ip.conf (docker bridge range + loopback). The nginx ports are
    # published loopback-only (127.0.0.1 in docker-compose.yml), so no remote client
    # can reach nginx directly to forge X-Forwarded-For — every request arrives via a
    # host-local reverse proxy (cloudflared, localhost dev) or a sibling container,
    # which keeps the restored client IP unforgeable from the outside.
    #
    # After real_ip restores the client IP, any remaining source in the private
    # docker-bridge range (172.16.0.0/12) is local traffic that came through
    # docker-proxy without proxy headers (docker-proxy masquerades it as the bridge
    # gateway). Surface that as 127.0.0.1 so local requests do not record a static
    # gateway address. site.conf overwrites X-Forwarded-For with this value, so a
    # forged client-supplied chain can never reach the backend.
    map $remote_addr $xff_addr {
        default                          $remote_addr;
        ~^172\.(1[6-9]|2[0-9]|3[0-1])\.  127.0.0.1;
    }

    # Preserve WebSocket upgrades while allowing HTTP/1.1 keepalive to upstreams.
    # An empty value for non-upgrade requests drops the Connection header so the
    # proxy can reuse upstream connections from the keepalive pool.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # Social + AI/LLM crawlers (Discordbot, Twitterbot, facebookexternalhit, ...,
    # GPTBot, ClaudeBot, PerplexityBot, ...) get server-rendered HTML from the
    # backend instead of the SPA shell.
    map $http_user_agent $is_bot {
        default 0;
        "~*Discordbot" 1;
        "~*Twitterbot" 1;
        "~*facebookexternalhit" 1;
        "~*Facebot" 1;
        "~*TelegramBot" 1;
        "~*LinkedInBot" 1;
        "~*Slackbot" 1;
        "~*WhatsApp" 1;
        "~*Pinterest" 1;
        "~*vkShare" 1;
        "~*redditbot" 1;
        "~*YandexBot" 1;
        "~*bingbot" 1;
        "~*Googlebot" 1;
        "~*Applebot" 1;
        "~*GPTBot" 1;
        "~*ClaudeBot" 1;
        "~*AnthropicAI" 1;
        "~*PerplexityBot" 1;
        "~*ChatGPT-User" 1;
        "~*OAI-SearchBot" 1;
        "~*Google-Extended" 1;
        "~*Bytespider" 1;
        "~*CCBot" 1;
        "~*Amazonbot" 1;
        "~*cohere-ai" 1;
        "~*Meta-ExternalAgent" 1;
        "~*Applebot-Extended" 1;
    }

    # Upstreams
    upstream frontend {
        server frontend:80;
        keepalive 32;
    }

    upstream backend {
        server backend:3000;
        keepalive 32;
    }

    # Per-domain TLS server blocks for custom domains (managed by the backend ACME service)
    include /etc/nginx/certs/custom-domains.conf;

    # App-host detection map (generated by entrypoint.sh)
    include /etc/nginx/conf.d/app-host.conf;

    # HTTP
    server {
        listen 80;
        include /etc/nginx/custom/site.conf;
    }

    # HTTPS
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/conf.d/hsts.conf;

        include /etc/nginx/custom/site.conf;
    }
}
