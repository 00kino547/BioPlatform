name: Build & Publish Docker Images

# Publishing policy (see AGENTS.md "GitHub Release Prerelease Policy"):
#
#   * A push to `main` is a BUILD ONLY. It verifies the images still assemble but
#     publishes nothing, so an in-progress / unreleased state can never overwrite
#     the `latest` image that operators pull.
#   * Images are published ONLY from a version tag (`v1.3.2`, `v1.3.2-beta.1`,
#     ...) or from a manual run that supplies an explicit `version`. That keeps
#     the tag on the image equal to the reason the image was cut — never a
#     meaningless `latest`-on-every-commit or raw commit-SHA tag.
#   * `latest` and the rolling `major.minor` channel tag are reserved for STABLE
#     versions. A prerelease (`1.3.2-beta.1`) is published under its own exact
#     version tag only, so it can never be mistaken for the current release.
#   * A push to `main` that touches NONE of the image build inputs (docs,
#     AGENTS.md, CHANGELOG, TASKS.md, nginx/, pocketbase/, compose files, CI
#     config, …) cannot produce a different image, so the build and the publish
#     are both skipped. A push that touches any build input runs normally.
#   * Every published image goes to BOTH registries (Docker Hub + GHCR) with
#     every tag that applies, so the two registries never drift.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.3.2 or 1.3.2-beta.1 (empty = build only, publish nothing)"
        required: false
        type: string
      force:
        description: "Build even if this push changes no image build input"
        required: false
        default: false
        type: boolean

concurrency:
  group: docker-${{ github.ref }}
  # Never cancel a publish half-way: a version tag must always finish tagging
  # every image. Branch (build-only) runs are safe to supersede.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  DOCKERHUB_NAMESPACE: dracoservices

jobs:
  # Decide whether this push can possibly change the published images. The two
  # Dockerfiles COPY exactly the paths listed in IMAGE_INPUTS below (plus the
  # root manifests they install from), so anything outside that set — a docs
  # edit, a CI config change, AGENTS.md — yields a byte-identical image and
  # there is nothing worth building or pushing.
  changes:
    name: Detect image-affecting changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout (full history so the base commit is available)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the push against its base commit
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # Keep in sync with the COPY lines in apps/backend/Dockerfile and
          # apps/frontend/Dockerfile.
          IMAGE_INPUTS='^(apps/backend/|apps/frontend/|packages/shared/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$)'

          if [ "$FORCE" = "true" ]; then
            echo "force=true - building and publishing regardless of the diff."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manual run, the first push of a branch and a tag push all have no
          # usable "before" commit. Never silently skip those: an explicit
          # release cut must always build and publish.
          if [ "$EVENT_NAME" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base commit ($EVENT_NAME) - building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Base commit ${BEFORE} is not in this checkout - building to be safe."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE" "$SHA" || true)"
          if [ -z "$changed" ]; then
            echo "This push contains no file changes - skipping build and publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -qE "$IMAGE_INPUTS"; then
            echo "Image build inputs changed - building and publishing:"
            printf '%s\n' "$changed" | grep -E "$IMAGE_INPUTS" | sed 's/^/    + /'
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image build input changed - skipping build and publish:"
            printf '%s\n' "$changed" | sed 's/^/    - /'
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build & publish ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bioplatform-backend
            dockerfile: apps/backend/Dockerfile
          - image: bioplatform-frontend
            dockerfile: apps/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase owner
        id: names
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Decide what (if anything) gets published. The image tag is derived from
      # the version, so the tag on the image always explains why it exists.
      - name: Resolve publish target
        id: target
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          elif [ -n "${DISPATCH_VERSION:-}" ]; then
            version="${DISPATCH_VERSION#v}"
          fi

          if [ -z "$version" ]; then
            echo "Build-only run (no version supplied) - images are built but NOT pushed."
            {
              echo "publish=false"
              echo "prerelease=false"
              echo "version="
              echo "channel="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A version carrying a prerelease identifier (-dev/-alpha/-beta/-rc)
          # must never receive `latest` or the rolling channel tag.
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          # Rolling channel tag (1.3 for 1.3.2, 1.3.2-beta.1 -> 1.3) — stable only.
          channel="$(printf '%s' "${version%%-*}" | cut -d. -f1,2)"

          {
            echo "publish=true"
            echo "prerelease=$prerelease"
            echo "version=$version"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

          if [ "$prerelease" = true ]; then
            echo "Publishing PRERELEASE $version (no latest / channel tag)."
          else
            echo "Publishing STABLE $version (+ $channel, latest)."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
            ghcr.io/${{ steps.names.outputs.owner_lc }}/${{ matrix.image }}
          # Every tag is derived from the resolved version — no `latest`-on-every-
          # commit, no raw commit-SHA tags. `latest` and `major.minor` are gated
          # on a stable version.
          tags: |
            type=raw,value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.publish == 'true' }}
            type=raw,value=${{ steps.target.outputs.channel }},enable=${{ steps.target.outputs.publish == 'true' && steps.target.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.target.outputs.publish == 'true' && steps.target.outputs.prerelease == 'false' }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ steps.target.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
