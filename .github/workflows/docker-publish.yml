name: Build & Publish Docker Images

# Publishing policy (see AGENTS.md "GitHub Release Prerelease Policy"):
#
#   * A push to `main` is a BUILD ONLY. It verifies the images still assemble but
#     publishes nothing, so an in-progress / unreleased state can never overwrite
#     the `latest` image that operators pull.
#   * The moving channels (`public-canary`, `public-alpha`, any `dev-*`) publish ONE
#     rolling tag each — `:canary`, `:alpha`, `:dev` — and they publish only from a
#     successful run of the `Tests & Quality Gates` workflow. That is the whole point
#     of routing them through `workflow_run` instead of `push`: an untested commit can
#     never produce a pullable image. `workflow_run` runs the workflow file from the
#     DEFAULT branch, so this trigger only exists once this file has landed on `main`.
#   * Images are published ONLY from a version tag (`v1.3.2`, `v1.3.2-beta.1`,
#     ...) or from a manual run that supplies an explicit `version`. That keeps
#     the tag on the image equal to the reason the image was cut — never a
#     meaningless `latest`-on-every-commit or raw commit-SHA tag.
#   * `latest` and the rolling `major.minor` channel tag are reserved for STABLE
#     versions. A prerelease (`1.3.2-beta.1`) is published under its own exact
#     version tag only, so it can never be mistaken for the current release.
#   * A push to `main` that touches NONE of the image build inputs (docs,
#     AGENTS.md, CHANGELOG, TASKS.md, nginx/, pocketbase/, compose files, CI
#     config, …) cannot produce a different image, so the build and the publish
#     are both skipped. A push that touches any build input runs normally.
#   * Every published image goes to BOTH registries (Docker Hub + GHCR) with
#     every tag that applies, so the two registries never drift.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_run:
    # The moving channels publish from here, NOT from `push`: this fires only when the
    # quality gate finished, and the publish step refuses anything but `success`.
    # `branches` filters on the gate run's head branch, so a green run on `main` never
    # triggers a moving-channel publish.
    workflows: ["Tests & Quality Gates"]
    types: [completed]
    branches: ["public-canary", "public-alpha", "dev-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.3.2 or 1.3.2-beta.1 (empty = build only, publish nothing)"
        required: false
        type: string
      force:
        description: "Build even if this push changes no image build input"
        required: false
        default: false
        type: boolean

# Deny every scope by default, then grant the minimum per job below. A workflow
# with no `permissions:` block inherits the repository default, which is commonly
# read/write on all scopes — which would let a poisoned build script push branches
# and releases. The publish job re-declares `packages: write` for itself.
permissions: {}

concurrency:
  # On a `workflow_run`, `github.ref` is the DEFAULT branch (refs/heads/main). Keying
  # on it alone would drop every moving channel AND the main build-only run into one
  # group, where they would cancel each other. Use the gate run's head branch when there
  # is one and fall back to the pushed ref for push/dispatch runs.
  group: docker-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  # Never cancel a publish half-way: a version tag must always finish tagging every
  # image, and a moving-channel publish pushes a real, pullable tag. Only the build-only
  # `main` push is safe to supersede. `github.ref_type` is `branch` for workflow_run too,
  # so the event name must be part of the condition or a canary publish would be killed.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

env:
  DOCKERHUB_NAMESPACE: dracoservices

jobs:
  # Decide whether this push can possibly change the published images. The two
  # Dockerfiles COPY exactly the paths listed in IMAGE_INPUTS below (plus the
  # root manifests they install from), so anything outside that set — a docs
  # edit, a CI config change, AGENTS.md — yields a byte-identical image and
  # there is nothing worth building or pushing.
  changes:
    name: Detect image-affecting changes
    runs-on: ubuntu-latest
    # This job only reads git history to decide whether a build is needed: no
    # registry push, no release write, so `contents: read` is the whole grant.
    permissions:
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout (full history so the base commit is available)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Do not leave the job's GITHUB_TOKEN in .git/config: nothing here
          # pushes with git, and a persisted token would be readable by any
          # later step (or build script) that touches the working tree.
          persist-credentials: false
          # On a workflow_run, `github.sha` is the DEFAULT branch tip, so without this
          # the gate would pass on the canary commit and the image would be built from
          # main. `github.event.workflow_run.head_sha` is empty for push/dispatch runs,
          # which then fall back to `github.sha` exactly as before.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compare the push against its base commit
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # Keep in sync with the COPY lines in apps/backend/Dockerfile and
          # apps/frontend/Dockerfile.
          IMAGE_INPUTS='^(apps/backend/|apps/frontend/|packages/shared/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$)'

          if [ "$FORCE" = "true" ]; then
            echo "force=true - building and publishing regardless of the diff."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manual run, the first push of a branch and a tag push all have no
          # usable "before" commit. Never silently skip those: an explicit
          # release cut must always build and publish.
          if [ "$EVENT_NAME" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base commit ($EVENT_NAME) - building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Base commit ${BEFORE} is not in this checkout - building to be safe."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE" "$SHA" || true)"
          if [ -z "$changed" ]; then
            echo "This push contains no file changes - skipping build and publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -qE "$IMAGE_INPUTS"; then
            echo "Image build inputs changed - building and publishing:"
            printf '%s\n' "$changed" | grep -E "$IMAGE_INPUTS" | sed 's/^/    + /'
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image build input changed - skipping build and publish:"
            printf '%s\n' "$changed" | sed 's/^/    - /'
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build & publish ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bioplatform-backend
            dockerfile: apps/backend/Dockerfile
          - image: bioplatform-frontend
            dockerfile: apps/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Images are pushed by buildx with the registry logins below, never by
          # git, so the checkout does not need to keep a credential around.
          persist-credentials: false
          # Same reason as in the `changes` job: build the commit the gate actually
          # ran against, not the default branch tip.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Resolve which moving channel this workflow_run belongs to and reduce it to the
      # ONE rolling tag it is allowed to publish. Everything downstream (the metadata
      # tag list, the push decision, the cache scope) keys off these two outputs, so
      # there is exactly one place where "may this publish?" is decided.
      - name: Resolve moving channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          # Push, tag and dispatch runs are the numbered-release path; the `target`
          # step owns those and they publish no moving tag.
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "publish_channel=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A cancelled, skipped, timed-out or failed gate publishes nothing. This is
          # the single most important line in the file: it is what makes "nothing
          # reaches the registry untested" true rather than aspirational.
          if [ "$HEAD_CONCLUSION" != "success" ]; then
            echo "Quality gate concluded '$HEAD_CONCLUSION' - publishing nothing."
            echo "publish_channel=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$HEAD_BRANCH" in
            public-canary) tag="canary" ;;
            public-alpha)  tag="alpha" ;;
            dev-*)         tag="dev" ;;
            *)
              echo "Branch '$HEAD_BRANCH' is not a moving channel - publishing nothing."
              echo "publish_channel=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "Gate passed on '$HEAD_BRANCH' - publishing the rolling ':$tag' tag."
          {
            echo "publish_channel=true"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Compute lowercase owner
        id: names
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Decide what (if anything) gets published. The image tag is derived from
      # the version, so the tag on the image always explains why it exists.
      - name: Resolve publish target
        id: target
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          elif [ -n "${DISPATCH_VERSION:-}" ]; then
            version="${DISPATCH_VERSION#v}"
          fi

          if [ -z "$version" ]; then
            echo "Build-only run (no version supplied) - images are built but NOT pushed."
            {
              echo "publish=false"
              echo "prerelease=false"
              echo "version="
              echo "channel="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A version carrying a prerelease identifier (-dev/-alpha/-beta/-rc)
          # must never receive `latest` or the rolling channel tag.
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          # Rolling channel tag (1.3 for 1.3.2, 1.3.2-beta.1 -> 1.3) — stable only.
          channel="$(printf '%s' "${version%%-*}" | cut -d. -f1,2)"

          {
            echo "publish=true"
            echo "prerelease=$prerelease"
            echo "version=$version"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

          if [ "$prerelease" = true ]; then
            echo "Publishing PRERELEASE $version (no latest / channel tag)."
          else
            echo "Publishing STABLE $version (+ $channel, latest)."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
            ghcr.io/${{ steps.names.outputs.owner_lc }}/${{ matrix.image }}
          # Every tag is derived from the resolved version — no `latest`-on-every-
          # commit, no raw commit-SHA tags. `latest` and `major.minor` are gated
          # on a stable version.
          tags: |
            type=raw,value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.publish == 'true' }}
            type=raw,value=${{ steps.target.outputs.channel }},enable=${{ steps.target.outputs.publish == 'true' && steps.target.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.target.outputs.publish == 'true' && steps.target.outputs.prerelease == 'false' }}
            # The moving channels contribute exactly ONE rolling tag, enabled only by
            # the gate-gated `channel` step. Deliberately no per-commit SHA tag: the
            # channels overwrite a single tag instead of accumulating one per commit,
            # so the registry never fills up and there is nothing to garbage-collect.
            # Traceability comes from the org.opencontainers.image.revision label below.
            type=raw,value=${{ steps.channel.outputs.tag }},enable=${{ steps.channel.outputs.publish_channel == 'true' }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ steps.target.outputs.publish == 'true' || steps.channel.outputs.publish_channel == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # metadata-action derives its source/revision labels from the event context,
          # which for a workflow_run is the default branch — it would label a canary
          # image as `main`. Pin the real revision explicitly.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          # Scope the cache per channel so a burst of canary commits cannot evict and
          # invalidate the release cache (and vice versa) — they are different trees.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.channel.outputs.tag || 'release' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.channel.outputs.tag || 'release' }}
