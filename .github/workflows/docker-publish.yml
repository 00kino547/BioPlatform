name: Build & Publish Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: dracoservices

jobs:
  build-push:
    name: Build & publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bioplatform-backend
            dockerfile: apps/backend/Dockerfile
          - image: bioplatform-frontend
            dockerfile: apps/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase owner
        id: names
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
            ghcr.io/${{ steps.names.outputs.owner_lc }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_APP_TAGLINE=${{ vars.VITE_APP_TAGLINE }}
            VITE_APP_DESCRIPTION=${{ vars.VITE_APP_DESCRIPTION }}
            VITE_APP_URL=${{ vars.VITE_APP_URL }}
            VITE_APP_GITHUB_URL=${{ vars.VITE_APP_GITHUB_URL }}
            VITE_APP_OG_IMAGE=${{ vars.VITE_APP_OG_IMAGE }}
            VITE_CONTACT_URL=${{ vars.VITE_CONTACT_URL }}
            VITE_STATUS_URL=${{ vars.VITE_STATUS_URL }}
            VITE_DOCS_URL=${{ vars.VITE_DOCS_URL }}
