name: Registry Cleanup

# Removes stale and accidental tags from the Docker Hub repositories.
#
# WHY THIS IS A WORKFLOW AND NOT A LOCAL SCRIPT: the Docker Hub token only
# exists as a repository secret, so the deletion has to happen here.
#
# SAFETY MODEL — deleting a tag from a public registry is effectively
# irreversible. The manifest stops being referenced and is eventually garbage
# collected, so "re-push it later" is a rebuild, not an undo:
#   * dry_run defaults to TRUE. Nothing is deleted unless you explicitly pass
#     dry_run=false AND confirm_delete=DELETE. Typing the confirmation is
#     deliberate friction on purpose.
#   * The decision is allowlist-shaped: a tag SURVIVES if it is `latest` or
#     matches ^1\.3(\.|$). Everything else is only a candidate. Note the
#     direction of that risk — an unrecognised NEW tag (say `beta`) is treated
#     as a candidate, so always read the dry-run listing before confirming.
#   * Nothing here runs on push or on a schedule. Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = list only (default). false = actually delete.'
        required: false
        default: true
        type: boolean
      confirm_delete:
        description: 'Must be exactly "DELETE" to allow a destructive run.'
        required: false
        default: ""
        type: string
      repos:
        description: "Comma-separated repo suffixes under dracoservices."
        required: false
        default: "bioplatform-backend,bioplatform-frontend"
        type: string

# Deny everything. This workflow talks to Docker Hub with its own token and
# never touches the repository, git, or packages.
permissions: {}

concurrency:
  group: registry-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete stale Docker Hub tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete stale tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm_delete }}
          REPOS: ${{ inputs.repos }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set."
            exit 1
          fi

          dry="${DRY_RUN:-true}"
          deleted=0
          failed=0

          # Docker Hub's v2 management API does not accept HTTP Basic directly.
          # Basic is only used to exchange the account token at auth.docker.io
          # for a short-lived Bearer JWT scoped to the repositories we intend to
          # mutate; every subsequent call carries `Authorization: Bearer $JWT`.
          # Getting this wrong yields 401 on every request, so the exchange and
          # a read-only probe are done up front and a failure aborts before any
          # destructive call is attempted.
          hub_jwt=""
          exchange_jwt() {
            local repo="$1" body
            body="$(curl -sS --max-time 30 \
              --user "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              "https://auth.docker.io/token?service=hub.docker.com&scope=repository:dracoservices/${repo}:pull,push,delete")" || true
            printf '%s' "$body" | jq -r '.token // empty' 2>/dev/null || true
          }

          hub_get() {
            # $1 = repo, $2 = path. Prints the HTTP status; body goes to stdout
            # separately via the global $BODY.
            local repo="$1" path="$2"
            BODY="$(curl -sS --max-time 45 -H "Authorization: Bearer ${hub_jwt}" \
              "https://hub.docker.com/v2/repositories/dracoservices/${repo}${path}")" || true
          }

          preflight() {
            local repo="$1" code
            hub_jwt="$(exchange_jwt "$repo")"
            if [ -z "$hub_jwt" ]; then
              echo "    preflight: token exchange returned no JWT."
              hub_jwt=""
              return 1
            fi
            # Print what the token actually is, without printing the token.
            # A JWT is base64url segments; the middle one is the claim set and
            # is what tells us which audience/service the Hub API will accept.
            local claims
            claims="$(printf '%s' "$hub_jwt" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)"
            echo "    preflight: JWT claims -> ${claims:-<undecodable>}"

            local body_file
            body_file="$(mktemp)"
            code="$(curl -sS -o "$body_file" -w '%{http_code}' --max-time 45 \
              -H "Authorization: Bearer ${hub_jwt}" \
              "https://hub.docker.com/v2/repositories/dracoservices/${repo}/tags?page_size=1")" || code="000"
            echo "    preflight: authenticated read -> HTTP ${code}"
            echo "    preflight: response body -> $(head -c 400 "$body_file" | tr -d '\n')"
            rm -f "$body_file"
            [ "$code" = "200" ] || return 1
            return 0
          }

          # hub_get's caller inspects $BODY; declared here for clarity.
          BODY=""

          for repo in ${REPOS//,/ }; do
            [ -n "$repo" ] || continue
            echo "=== dracoservices/$repo ==="

            # Authenticate before anything else. A credential problem must stop
            # the run here, not surface as 39 silent "successes" further down.
            if ! preflight "$repo"; then
              echo "::error::preflight failed for ${repo}; refusing to delete."
              exit 1
            fi

            # Collect every tag name, following Docker Hub's pagination.
            listing="$(mktemp)"
            page=1
            while :; do
              hub_get "$repo" "/tags?page_size=100&page=${page}"
              count="$(printf '%s' "$BODY" | jq -r '(.results // []) | length')"
              if [ "$count" -eq 0 ]; then
                break
              fi
              printf '%s' "$BODY" | jq -r '.results[].name' >> "$listing"
              page=$((page + 1))
            done

            victims=()
            while read -r tag; do
              [ -n "$tag" ] || continue
              if [ "$tag" = "latest" ] || printf '%s' "$tag" | grep -qE '^1\.3(\.|$)'; then
                printf '    keep    %s\n' "$tag"
              else
                printf '    DELETE  %s\n' "$tag"
                victims+=("$tag")
              fi
            done < "$listing"
            rm -f "$listing"

            echo "    -> ${#victims[@]} candidate(s) for deletion"

            if [ "$dry" = "true" ]; then
              echo "    (dry run: nothing deleted)"
              continue
            fi

            if [ "${CONFIRM:-}" != "DELETE" ]; then
              echo "::error::confirm_delete is '${CONFIRM:-}', expected exactly 'DELETE'."
              exit 1
            fi

            for tag in "${victims[@]}"; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer ${hub_jwt}" \
                "https://hub.docker.com/v2/repositories/dracoservices/${repo}/tags/${tag}/")" || code="000"
              if [ "$code" = "204" ] || [ "$code" = "200" ] || [ "$code" = "202" ]; then
                printf '    deleted %s -> HTTP %s\n' "$tag" "$code"
                deleted=$((deleted + 1))
              else
                # Anything else is a real failure. Report it and keep counting it
                # separately rather than folding it into the success total.
                printf '    FAILED   %s -> HTTP %s\n' "$tag" "$code"
                failed=$((failed + 1))
              fi
              # Docker Hub rate-limits tag mutations; stay well clear of it.
              sleep 1
            done

            # Re-read the tag list so the outcome is verified against the
            # registry instead of trusted from the DELETE status codes alone.
            hub_get "$repo" "/tags?page_size=100"
            remaining="$(printf '%s' "$BODY" | jq -r '[.results[].name] | map(select(. == "latest" or test("^1\\.3(\\.|$)"))) | length')"
            echo "    remaining keep-list tags present: ${remaining}"
          done

          echo "=== done: ${deleted} deleted, ${failed} failed (dry_run=${dry}) ==="
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} deletion(s) failed. The registry is NOT in the requested state."
            exit 1
          fi