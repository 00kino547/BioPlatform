name: Registry Cleanup

# Removes stale and accidental tags from the Docker Hub repositories.
#
# WHY THIS IS A WORKFLOW AND NOT A LOCAL SCRIPT: the Docker Hub token only
# exists as a repository secret, so the deletion has to happen here.
#
# WHY IT USES THE REGISTRY API AND NOT hub.docker.com/v2: Hub's v2 management
# API rejects tag deletion (it answers 401 even with a correctly-scoped
# token), so deletion has to go through the OCI distribution API instead. That
# means deleting by DIGEST, not by name — which is a sharp edge, and the
# reason for the keep-digest guard below.
#
# SAFETY MODEL — deleting a tag from a public registry is effectively
# irreversible. The manifest stops being referenced and is eventually garbage
# collected, so "re-push it later" is a rebuild, not an undo:
#   * dry_run defaults to TRUE. Nothing is deleted unless you explicitly pass
#     dry_run=false AND confirm_delete=DELETE. Typing the confirmation is
#     deliberate friction on purpose.
#   * The decision is allowlist-shaped: a tag SURVIVES if it is `latest` or
#     matches ^1\.3(\.|$). Everything else is only a candidate. Note the
#     direction of that risk — an unrecognised NEW tag (say `beta`) is treated
#     as a candidate, so always read the dry-run listing before confirming.
#   * Deleting by digest removes EVERY tag that points at that digest. Before
#     deleting, the digest is compared against the digests of all tags being
#     kept; a candidate sharing a digest with a kept tag is SKIPPED, because
#     honouring the request would destroy a tag the user asked to preserve.
#   * Nothing here runs on push or on a schedule. Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = list only (default). false = actually delete.'
        required: false
        default: true
        type: boolean
      confirm_delete:
        description: 'Must be exactly "DELETE" to allow a destructive run.'
        required: false
        default: ""
        type: string
      repos:
        description: "Comma-separated repo suffixes under dracoservices."
        required: false
        default: "bioplatform-backend,bioplatform-frontend"
        type: string

# Deny everything. This workflow talks to Docker Hub with its own token and
# never touches the repository, git, or packages.
permissions: {}

concurrency:
  group: registry-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete stale Docker Hub tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete stale tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm_delete }}
          REPOS: ${{ inputs.repos }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set."
            exit 1
          fi

          NS="dracoservices"
          REGISTRY="registry-1.docker.io"
          deleted=0
          failed=0
          skipped=0

          # A tag survives if it is `latest` or in the 1.3.x line.
          keep_tag() {
            [ "$1" = "latest" ] && return 0
            printf '%s' "$1" | grep -qE '^1\.3(\.|$)'
          }

          # ------------------------------------------------------------------
          # Step 1: read every tag and its digest from the Hub API.
          #
          # Hub's v2 read endpoints accept HTTP Basic with the PAT directly;
          # only its DELETE endpoint is broken. Verified by probing.
          # ------------------------------------------------------------------
          read_tags() {
            local repo="$1" out="$2" body page count
            : > "$out"
            page=1
            while :; do
              body="$(curl -sS --max-time 60 \
                --user "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${NS}/${repo}/tags?page_size=100&page=${page}")" || true
              count="$(printf '%s' "$body" | jq -r '(.results // []) | length')"
              [ "$count" -gt 0 ] || break
              # Emit "name<TAB>digest" per tag. A tag can carry several
              # platform-specific digests; they are all recorded so the
              # keep-digest guard cannot be fooled by a multi-arch image.
              printf '%s' "$body" | jq -r '
                .results[] | .name as $n | (.digest // ( .images[0].digest // "" )) as $d
                | "\($n)\t\($d)"' >> "$out"
              page=$((page + 1))
            done
          }

          # ------------------------------------------------------------------
          # Step 2: get a registry token with delete scope.
          # ------------------------------------------------------------------
          registry_jwt() {
            curl -sS --max-time 30 \
              --user "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${NS}/$1:pull,push,delete" \
              | jq -r '.token // empty' 2>/dev/null || true
          }

          # ------------------------------------------------------------------
          # Step 3: delete one manifest by digest.
          # ------------------------------------------------------------------
          delete_digest() {
            local repo="$1" jwt="$2" digest="$3"
            curl -sS -o /dev/null -w '%{http_code}' --max-time 60 -X DELETE \
              -H "Authorization: Bearer ${jwt}" \
              "https://${REGISTRY}/v2/${NS}/${repo}/manifests/${digest}"
          }

          for repo in ${REPOS//,/ }; do
            [ -n "$repo" ] || continue
            echo "=== ${NS}/${repo} ==="

            tags="$(mktemp)"
            read_tags "$repo" "$tags"
            total="$(wc -l < "$tags" | tr -d ' ')"
            echo "    read ${total} tag(s)"

            jwt="$(registry_jwt "$repo")"
            if [ -z "$jwt" ]; then
              echo "::error::could not obtain a registry token with delete scope for ${repo}."
              exit 1
            fi

            # Collect every digest reachable from a tag we are KEEPING.
            keep_digests_file="$(mktemp)"
            victims_file="$(mktemp)"
            while IFS=$'\t' read -r tag digest; do
              [ -n "$tag" ] || continue
              if keep_tag "$tag"; then
                printf '    keep    %s\n' "$tag"
                [ -n "$digest" ] && printf '%s\n' "$digest" >> "$keep_digests_file"
              else
                printf '    DELETE  %s\n' "$tag"
                printf '%s\t%s\n' "$tag" "$digest" >> "$victims_file"
              fi
            done < "$tags"

            # The sharp edge of digest-based deletion: one manifest, many tag
            # names. Never delete a digest that a surviving tag also points at.
            while IFS=$'\t' read -r tag digest; do
              [ -n "$tag" ] || continue
              if [ -z "$digest" ]; then
                echo "    SKIP    ${tag} (no digest reported; cannot delete safely)"
                skipped=$((skipped + 1))
              elif grep -qxF "$digest" "$keep_digests_file"; then
                echo "    SKIP    ${tag} (digest is shared with a kept tag)"
                skipped=$((skipped + 1))
              else
                printf '%s\n' "$digest"
              fi
            done < "$victims_file" | sort -u > "${victims_file}.digests"

            candidates="$(wc -l < "$victims_file" | tr -d ' ')"
            echo "    -> ${candidates} candidate(s)"

            if [ "${DRY_RUN:-true}" = "true" ]; then
              echo "    (dry run: nothing deleted)"
              rm -f "$tags" "$keep_digests_file" "$victims_file" "${victims_file}.digests"
              continue
            fi

            if [ "${CONFIRM:-}" != "DELETE" ]; then
              echo "::error::confirm_delete is '${CONFIRM:-}', expected exactly 'DELETE'."
              exit 1
            fi

            while read -r digest; do
              [ -n "$digest" ] || continue
              code="$(delete_digest "$repo" "$jwt" "$digest")" || code="000"
              if [ "$code" = "202" ] || [ "$code" = "204" ] || [ "$code" = "200" ]; then
                # Map the digest back to the tag name(s) it was going to remove.
                name="$(awk -F'\t' -v d="$digest" '$2 == d { printf "%s ", $1 }' "$victims_file")"
                printf '    deleted %s\n' "${name:-<unnamed>} (HTTP ${code})"
                deleted=$((deleted + 1))
              else
                printf '    FAILED  %s -> HTTP %s\n' "$digest" "$code"
                failed=$((failed + 1))
              fi
              # The registry rate-limits manifest mutations.
              sleep 1
            done < "${victims_file}.digests"

            # Verify the end state against the registry rather than trusting
            # the DELETE status codes.
            left="$(curl -sS --max-time 60 -H "Authorization: Bearer ${jwt}" \
              "https://${REGISTRY}/v2/${NS}/${repo}/tags/list" \
              | jq -r '[.tags[]?] | map(select(. == "latest" or test("^1\\.3(\\.|$)"))) | length')"
            echo "    remaining keep-list tags in registry: ${left}"

            rm -f "$tags" "$keep_digests_file" "$victims_file" "${victims_file}.digests"
          done

          echo "=== done: ${deleted} deleted, ${skipped} skipped, ${failed} failed (dry_run=${DRY_RUN:-true}) ==="
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} deletion(s) failed. The registry is NOT in the requested state."
            exit 1
          fi