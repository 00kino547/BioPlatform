name: Tests & Quality Gates

# CI gate: prove the backend test suite, TypeScript typechecks and linting
# genuinely run on every push/PR — and fail loudly with real exit codes when
# they do not. There was previously no test job in CI: the only workflow built
# and published Docker images, so broken tests were never caught until a human
# ran `pnpm --filter @bioplatform/backend test` locally.
#
# Note on the backend job: the test bootstrap (apps/backend/tests/setup-env.ts)
# tolerates a missing repo `.env` (falls back to process env + deterministic
# defaults) and connects to the Postgres service on 127.0.0.1:5432 with the
# default POSTGRES_PASSWORD=postgres. `prisma db push` creates the schema the
# tests run against; the drift step separately replays `prisma/migrations/` to
# prove a fresh `migrate deploy` produces the same schema.

on:
  push:
    # public-canary / public-alpha / dev-* are the moving channels: docker-publish.yml
    # publishes their `:canary` / `:alpha` / `:dev` tags from a workflow_run of THIS
    # workflow, gated on `conclusion == success`. So every image tag in the registry
    # that is not a numbered release has, by construction, passed this gate first.
    branches: [main, public-canary, public-alpha, "dev-*"]
  pull_request:

# Deny every scope by default, then grant the minimum per job below.
#
# Without an explicit `permissions:` block a workflow inherits whatever the
# repository default is, which for many repositories is read/write on ALL scopes:
# a compromised or malicious build script (a poisoned dependency is enough) would
# then be able to push branches, write releases and read every secret. This job
# only ever needs to read the code it checks out, so it says exactly that.
permissions: {}

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-quality:
    name: Backend tests + typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `contents: read` is the only scope this job needs: it checks the code out
    # and runs tests. It publishes nothing and writes nothing back.
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bioplatform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bioplatform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bioplatform_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job never pushes with git, so the job token is not persisted
          # into .git/config where a build script could read and reuse it.
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm 12
        run: |
          corepack enable
          corepack prepare pnpm@12.4.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @bioplatform/backend db:generate

      - name: Push schema to the test database
        run: pnpm --filter @bioplatform/backend db:push

      # A fresh production deploy runs `prisma migrate deploy`, not `db push`, so a
      # stale migrations/ directory would only ever surface on a new install. This
      # step is the guard for that: it replays every migration into an empty
      # database and fails if the result disagrees with schema.prisma. It was
      # silently broken once already -- `db:verify-drift` needed a
      # --shadow-database-url it never got, so it errored on every run instead of
      # checking anything, and five shipped columns (auth_version, email_verified,
      # email_verified_at, last_username_change_at, ProductType) were missing from
      # every fresh install while the hand-edited databases looked fine.
      - name: Verify migrations reproduce the schema
        # A dedicated EMPTY database: Prisma replays every migration into the
        # shadow database to work out the final schema, and it documents that
        # database as required to be empty.
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            -c "CREATE DATABASE bioplatform_shadow"
          SHADOW_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/bioplatform_shadow?schema=public" \
            pnpm --filter @bioplatform/backend db:verify-drift

      # The two compose files are supposed to be interchangeable deploy paths
      # (source build vs published image) and had drifted by 63 backend variables,
      # so an operator following the documented prebuilt path silently got schema
      # defaults for billing prices, invite packs and the rest. Nothing failed
      # loudly, so this compares the resolved backend environments and fails here.
      - name: Verify compose files forward the same backend variables
        run: pnpm compose:check

      - name: Run backend test suite
        run: pnpm --filter @bioplatform/backend test

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Lint all workspaces
        run: pnpm lint