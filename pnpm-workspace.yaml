packages:
  - "apps/*"
  - "packages/*"

node-linker: hoisted

allowBuilds:
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  bcrypt: true
  sharp: true

minimumReleaseAgeExclude:
  - nodemailer@9.0.4 || 10.0.13

overrides:
  nanoid: ^3.3.18
  deepmerge-ts: ^8.0.0
  qs: 6.16.0
