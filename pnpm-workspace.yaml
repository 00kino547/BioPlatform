packages:
  - "apps/*"
  - "packages/*"

# camelCase, not kebab-case. pnpm >= 12 ignores `node-linker` with
# `The following settings in pnpm-workspace.yaml were ignored because they are not
# written in camelCase`, which silently falls back to the isolated linker layout
# and breaks the Docker COPY steps. `nodeLinker` is understood by pnpm 11 too.
nodeLinker: hoisted

allowBuilds:
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  bcrypt: true
  sharp: true

minimumReleaseAgeExclude:
  - nodemailer@9.0.4 || 10.0.13

# Overrides live here rather than in root package.json's pnpm.overrides, because
# pnpm-workspace.yaml is the source of truth for a workspace and keeps the
# resolution policy next to `nodeLinker` and `allowBuilds`.
overrides:
  nanoid: ^3.3.18
  deepmerge-ts: ^8.0.0
  # Dependabot: CVE-2026-XXXXX in axios < 1.20.0. Reached transitively (Prisma
  # client tooling and friends), never declared directly, so there is no manifest
  # to bump — the override is the only place this can be corrected.
  axios: ^1.20.0
  # Dependabot: CVE in multer < 2.4.0. Same situation — the upload middleware is
  # pulled in transitively.
  multer: ^2.4.0
  # Dependabot: CVE in qs (< 6.16.0) reached transitively — pin the patched line.
  qs: 6.16.0
  # Dependabot: CVE-2026-102422 in shell-quote (< 1.11.0) — critical. Reached
  # transitively via concurrently (root devDependency), which pins it EXACTLY at
  # 1.9.0, so no manifest bump can move it — the override is the only correction.
  # `quote()` command injection via a line terminator in a token after a `{ comment }`.
  shell-quote: 1.11.0
  # Dependabot: CVE-2026-90711 in proxy-addr (< 2.0.8) — critical. IP spoofing via
  # IPv4-mapped IPv6 trust subnet. Reached transitively via express@5.2.1 (^2.0.7)
  # — pin the patched line explicitly.
  proxy-addr: ^2.0.8
  # Dependabot: CVE-2026-93749 in source-map-js (< 1.2.2) — high. Event-loop DoS
  # through indexed source-map section offsets. Reached transitively via vite /
  # @tailwindcss/node / postcss — pin the patched line explicitly.
  source-map-js: ^1.2.2

# NOT overridable, recorded so the exception is deliberate rather than an
# oversight. node-forge <= 1.4.0 carries CVE-2026-85393 (RSA signature forgery).
# It arrives via acme-client@5.4.0, which apps/backend/src/lib/acme.ts genuinely
# uses, and 1.4.0 is the newest published release with no patched version. An
# override can only pin what exists, so there is nothing to write here. ACME is
# opt-in: it is inert unless ACME_ENABLED is set.