services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      APP_URL: ${APP_URL:-http://localhost:80}
      APP_NAME: ${APP_NAME:-BioPlatform}
      APP_TAGLINE: ${APP_TAGLINE:-Your digital identity, beautifully crafted.}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      AUTH_LOCK_POLICY: ${AUTH_LOCK_POLICY:-trusted_ip}
      AUTH_LOCK_DURATION_MINUTES: ${AUTH_LOCK_DURATION_MINUTES:--1}
      AUTH_UNLOCK_TOKEN_TTL_MINUTES: ${AUTH_UNLOCK_TOKEN_TTL_MINUTES:-30}
      AUTH_LOG_RETENTION_DAYS: ${AUTH_LOG_RETENTION_DAYS:-30}
      AUTH_LOG_CLEANUP_INTERVAL_MINUTES: ${AUTH_LOG_CLEANUP_INTERVAL_MINUTES:-60}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_PROVIDER: ${SMTP_PROVIDER:-gmail}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-BioPlatform}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bioplatform.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:80}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-BioPlatform}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_INVITE: ${DISCORD_GUILD_INVITE:-}
      ACME_ENABLED: ${ACME_ENABLED:-false}
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_RENEW_BEFORE_DAYS: ${ACME_RENEW_BEFORE_DAYS:-30}
      ACME_INTERVAL_MINUTES: ${ACME_INTERVAL_MINUTES:-60}
      ACME_MAX_DOMAINS_PER_RUN: ${ACME_MAX_DOMAINS_PER_RUN:-20}
      ACME_CERTS_PATH: ${ACME_CERTS_PATH:-/app/certs}
    volumes:
      - uploads_data:/app/uploads
      - ./certs:/app/certs
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # Option A: build locally (build-time config via args)
    # Option B: prebuilt image from Docker Hub (no build; runtime config via env).
    # Comment out the "build" block above and uncomment the lines below.
    # 
    image: bioplatform-frontend2
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-BioPlatform}
      VITE_APP_TAGLINE: ${VITE_APP_TAGLINE:-Your digital identity, beautifully crafted.}
      VITE_APP_DESCRIPTION: ${VITE_APP_DESCRIPTION:-Create a stunning profile page that showcases who you are. Links, music, themes, and more — all in one place.}
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:80}
      VITE_APP_GITHUB_URL: ${VITE_APP_GITHUB_URL:-https://github.com/00kino547/BioPlatform}
      VITE_APP_OG_IMAGE: ${VITE_APP_OG_IMAGE:-http://localhost:80/og.png}
      VITE_CONTACT_URL: ${VITE_CONTACT_URL:-https://github.com/00kino547/BioPlatform/issues}
      VITE_STATUS_URL: ${VITE_STATUS_URL:-}
      VITE_DOCS_URL: ${VITE_DOCS_URL:-https://github.com/00kino547/BioPlatform/tree/main/docs}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      TLS_MODE: ${TLS_MODE:-development}
      SEND_HSTS_ON_DEV: ${SEND_HSTS_ON_DEV:-false}
      CF_TRUSTED_IPS: ${CF_TRUSTED_IPS:-172.16.0.0/12,127.0.0.1,::1}
      APP_URL_HOST: ${APP_URL_HOST:-}
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/site.conf:/etc/nginx/custom/site.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend
    profiles:
      - nginx

volumes:
  postgres_data:
  uploads_data:

networks:
  default:
    name: bioplatform_net
