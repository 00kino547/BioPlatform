services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host ports are parameterised so a second, independent stack can run on
      # the same host. Inside the network the container port is still 5432 and
      # the service name is still `postgres`, so DATABASE_URL is unaffected.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
      - "[::1]:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
      - "[::1]:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PocketBase — OPTIONAL, and only ever a sign-in provider. Bundled so enabling
  # it is a pure env change; it runs lean and idle when POCKETBASE_URL is left
  # empty, and BioPlatform is fully functional without it. No port is published —
  # the browser reaches PocketBase only through nginx's /api/pb-speed/ proxy, so
  # there is no public surface and no CORS. The former analytics module (which
  # posted visitor events straight to PB through that proxy) and the
  # never-implemented storage/content modules were removed; the analytics env
  # flags below are gone with them.
  # PocketBase is EXPERIMENTAL and is not part of the main stack. It lives behind
  # an opt-in profile so `docker compose --profile nginx up -d` never starts it:
  #   docker compose --profile pocketbase up -d
  # The backend bootstraps soft when PB is unreachable (see index.ts), so nothing
  # here is required for a normal deployment.
  pocketbase:
    profiles: ["pocketbase"]
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
      args:
        POCKETBASE_VERSION: ${POCKETBASE_VERSION:-v0.40.4}
    image: bioplatform-pocketbase:local
    restart: unless-stopped
    environment:
      PB_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-}
      PB_PORT: 8090
    volumes:
      - pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Weblate — OPTIONAL self-hosted translation platform, behind an opt-in profile.
  # It lets the community translate the UI's user-visible strings and opens a
  # Pull Request against `main` with the translations. Start it with:
  #   docker compose --profile weblate up -d
  # It is fully isolated from the application stack: its OWN PostgreSQL and its
  # OWN Redis (never the app's `postgres`/`redis`). It publishes one loopback
  # port (WEBLATE_HOST_PORT, default 8080) so the `weblate` profile alone is
  # usable without nginx. The operator can front that port with their own
  # reverse proxy + TLS, or use the optional nginx vhost. See
  # docs/en/translating.md (Spanish: docs/es/translating.md) for the full runbook.
  #
  # IMAGE TAGS ARE PINNED ON PURPOSE. `weblate/weblate:5` tracks the 5.x stable
  # line; bump it deliberately after reviewing the Weblate upgrade notes
  # (https://docs.weblate.org/en/latest/admin/upgrade.html) — a stray `latest`
  # can pull a database-migrating release into a running instance.
  weblate:
    profiles: ["weblate"]
    image: weblate/weblate:5
    restart: unless-stopped
    environment:
      # Public hostname the operator's proxy serves Weblate on (host or host:port).
      # Required by the image; drives absolute links in e-mails and the API.
      WEBLATE_SITE_DOMAIN: ${WEBLATE_SITE_DOMAIN}
      WEBLATE_SITE_TITLE: ${WEBLATE_SITE_TITLE:-BioPlatform translations}
      # Admin account created on first boot. With WEBLATE_ADMIN_PASSWORD set the
      # image creates/updates this account on every start, so keep the value in
      # .env and change it there if you need to recover the login.
      WEBLATE_ADMIN_NAME: ${WEBLATE_ADMIN_NAME}
      WEBLATE_ADMIN_EMAIL: ${WEBLATE_ADMIN_EMAIL}
      WEBLATE_ADMIN_PASSWORD: ${WEBLATE_ADMIN_PASSWORD}
      # GitHub OAuth app so contributors sign in with their GitHub account
      # (same provider they use to open the translation Pull Requests).
      WEBLATE_SOCIAL_AUTH_GITHUB_KEY: ${WEBLATE_SOCIAL_AUTH_GITHUB_KEY}
      WEBLATE_SOCIAL_AUTH_GITHUB_SECRET: ${WEBLATE_SOCIAL_AUTH_GITHUB_SECRET}
      # Outgoing mail (registration, notifications, commit mail). Weblate's image
      # reads these Django-style settings straight from the WEBLATE_* names.
      WEBLATE_SERVER_EMAIL: ${WEBLATE_SERVER_EMAIL}
      WEBLATE_DEFAULT_FROM_EMAIL: ${WEBLATE_DEFAULT_FROM_EMAIL}
      WEBLATE_EMAIL_HOST: ${WEBLATE_EMAIL_HOST}
      WEBLATE_EMAIL_PORT: ${WEBLATE_EMAIL_PORT}
      WEBLATE_EMAIL_HOST_USER: ${WEBLATE_EMAIL_HOST_USER}
      WEBLATE_EMAIL_HOST_PASSWORD: ${WEBLATE_EMAIL_HOST_PASSWORD}
      WEBLATE_EMAIL_USE_TLS: ${WEBLATE_EMAIL_USE_TLS}
      # Dedicated datastores — the service names below are only resolvable on the
      # internal network, so Weblate can never reach the app's postgres/redis.
      POSTGRES_HOST: weblate-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${WEBLATE_POSTGRES_DB:-weblate}
      POSTGRES_USER: ${WEBLATE_POSTGRES_USER:-weblate}
      POSTGRES_PASSWORD: ${WEBLATE_POSTGRES_PASSWORD}
      REDIS_HOST: weblate-redis
      REDIS_PORT: "6379"
      # Operator terminates TLS in front of Weblate (no host port is published
      # here). ENABLE_HTTPS makes Weblate emit https:// links and set secure
      # cookies; without it Weblate 5.7+ refuses to start over WebAuthn checks.
      WEBLATE_ENABLE_HTTPS: ${WEBLATE_ENABLE_HTTPS:-1}
      WEBLATE_ALLOWED_HOSTS: ${WEBLATE_ALLOWED_HOSTS:-*}
      # TLS terminates at the reverse proxy, so Weblate (5.13+ runs granian)
      # MUST be told which header carries the client scheme, or it cannot know
      # it is served over HTTPS and CSRF/origin checks fail. The header name
      # and value are comma-separated and case-sensitive.
      WEBLATE_SECURE_PROXY_SSL_HEADER: ${WEBLATE_SECURE_PROXY_SSL_HEADER:-HTTP_X_FORWARDED_PROTO,https}
      # Public https origin(s) allowed to submit forms through the proxy.
      WEBLATE_CSRF_TRUSTED_ORIGINS: ${WEBLATE_CSRF_TRUSTED_ORIGINS:-}
      # Trust X-Forwarded-For only from our own proxy (the docker bridge range);
      # the proxy overwrites the header, so a client cannot forge its address.
      WEBLATE_IP_PROXY_HEADER: ${WEBLATE_IP_PROXY_HEADER:-HTTP_X_FORWARDED_FOR}
      WEBLATE_TRUSTED_PROXY_ADDRESSES: ${WEBLATE_TRUSTED_PROXY_ADDRESSES:-172.16.0.0/12}
      # Let contributors self-register; any language is welcome.
      WEBLATE_REGISTRATION_OPEN: ${WEBLATE_REGISTRATION_OPEN:-1}
      # Review-before-commit is the enforced workflow: new translations and source
      # strings default to needing review/approval before they may be committed.
      # Combined with the per-project review settings this is what keeps an
      # unreviewed string out of a Pull Request. Machine translation is offered as
      # SUGGESTIONS only — no automatic-translation add-on is enabled, so MT can
      # never be committed on its own.
      WEBLATE_DEFAULT_TRANSLATION_REVIEW: "1"
      WEBLATE_DEFAULT_SOURCE_REVIEW: "1"
      # Reference-only pass-through: the git remote used by both Weblate projects
      # for translation Pull Requests (this repo's `origin`). Weblate reads
      # project components' repo URLs from its database/UI, so configure it in
      # each project; this variable keeps the value in .env, not in the image.
      WEBLATE_GIT_REPO: ${WEBLATE_GIT_REPO}
      # Credentials used to OPEN pull requests (the "GitHub" VCS). Configure
      # GitHub VCS and a dedicated Push branch per component:
      # weblate_canary_<component> -> public-canary; weblate_main_<component> -> main.
      # Never use a target branch as Push branch. Use an SSH Push URL for each branch.
      # Use a fine-grained PAT with contents:write and
      # pull_requests:write on the target repo. Weblate 6 looks up credentials
      # by GitHub API host.
      WEBLATE_GITHUB_HOST: ${WEBLATE_GITHUB_HOST:-api.github.com}
      WEBLATE_GITHUB_USERNAME: ${WEBLATE_GITHUB_USERNAME:-}
      WEBLATE_GITHUB_TOKEN: ${WEBLATE_GITHUB_TOKEN:-}
      WEBLATE_GPG_IDENTITY: ${WEBLATE_GPG_IDENTITY:-}
      WEBLATE_DEFAULT_COMMITER_EMAIL: ${WEBLATE_DEFAULT_COMMITER_EMAIL:-noreply@weblate.org}
      # Weblate's own CSP must allow its inline repository-page bootstrap.
      # Cloudflare Insights is intentionally not allowed.
      WEBLATE_CSP_SCRIPT_SRC: ${WEBLATE_CSP_SCRIPT_SRC:-'unsafe-inline'}
    ports:
      # Loopback-only, like every other host port in this file. Makes the
      # `weblate` profile self-sufficient: `docker compose --profile weblate
      # up -d` serves Weblate on http://127.0.0.1:${WEBLATE_HOST_PORT:-8080}
      # without nginx. The nginx vhost (when enabled) keeps using the internal
      # `weblate:8080` address, so exposing this port is optional for proxies.
      - "127.0.0.1:${WEBLATE_HOST_PORT:-8080}:8080"
      - "[::1]:${WEBLATE_HOST_PORT:-8080}:8080"
    volumes:
      # Weblate's DATA_DIR (cloned repos, uploaded screenshots, secrets, etc.).
      - weblate_data:/app/data
    depends_on:
      weblate-postgres:
        condition: service_healthy
      weblate-redis:
        condition: service_healthy

  # Dedicated PostgreSQL for Weblate only. No host port, no shared volume with the
  # application's database — a Weblate upgrade or restore can never touch app data.
  weblate-postgres:
    profiles: ["weblate"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WEBLATE_POSTGRES_USER:-weblate}
      POSTGRES_PASSWORD: ${WEBLATE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${WEBLATE_POSTGRES_DB:-weblate}
    volumes:
      - weblate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WEBLATE_POSTGRES_USER:-weblate} -d ${WEBLATE_POSTGRES_DB:-weblate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated Redis for Weblate's cache and Celery broker only. Ephemeral by
  # design (no persistence, no volume): a restart only loses transient cache.
  weblate-redis:
    profiles: ["weblate"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      # `:-` is REQUIRED, not cosmetic. `${PORT}` with no fallback interpolates
      # an EMPTY STRING when the host variable is unset, and the backend's Zod
      # default only fires for `undefined` — so an unset PORT reached the
      # process as "" and `z.coerce.number()` resolved it to 0, binding a random
      # ephemeral port: the container logged a successful start and then never
      # answered its healthcheck. Matches the convention every other variable in
      # this file uses.
      PORT: ${PORT:-3000}
      APP_URL: ${APP_URL:-http://localhost:80}
      APP_NAME: ${APP_NAME:-BioPlatform}
      APP_TAGLINE: ${APP_TAGLINE:-Your digital identity, beautifully crafted.}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-Create a stunning profile page that showcases who you are. Links, music, themes, and more — all in one place.}
      APP_GITHUB_URL: ${APP_GITHUB_URL:-https://github.com/00kino547/BioPlatform}
      # Human-editable instance config. Default "config.yml" resolves against the
      # container WORKDIR (/app); the repo-root ./config.yml is bind-mounted READ-
      # WRITE below (auto-reload + `config reload` signal changes by bumping mtime).
      # Create it BEFORE first boot: `cp config.yml.example config.yml` (see
      # docs/en/configuration.md). If the host file is absent, Docker would create
      # an empty DIRECTORY at ./config.yml — the loader then treats it as "absent"
      # and runs on defaults, so always copy the example first.
      CONFIG_FILE: ${CONFIG_FILE:-config.yml}
      # true = auto hot-reload on save; false = explicit `pnpm cli config reload` only.
      CONFIG_AUTO_RELOAD: ${CONFIG_AUTO_RELOAD:-true}
      SEED_ON_START: ${SEED_ON_START:-false}
      UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-true}
      UPDATE_CHECK_INTERVAL_MINUTES: ${UPDATE_CHECK_INTERVAL_MINUTES:-720}
      UPDATE_CHECK_STALE_MAX_MINUTES: ${UPDATE_CHECK_STALE_MAX_MINUTES:-1440}
      UPDATE_CRITICAL_STALE_THRESHOLD: ${UPDATE_CRITICAL_STALE_THRESHOLD:-3}
      UPDATE_CHECK_INCLUDE_PRERELEASES: ${UPDATE_CHECK_INCLUDE_PRERELEASES:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379}
      CACHE_FILE_DIR: ${CACHE_FILE_DIR:-/app/data/cache}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      AUTH_LOCK_POLICY: ${AUTH_LOCK_POLICY:-trusted_ip}
      AUTH_LOCK_DURATION_MINUTES: ${AUTH_LOCK_DURATION_MINUTES:--1}
      AUTH_UNLOCK_TOKEN_TTL_MINUTES: ${AUTH_UNLOCK_TOKEN_TTL_MINUTES:-30}
      AUTH_LOG_RETENTION_DAYS: ${AUTH_LOG_RETENTION_DAYS:-30}
      AUTH_LOG_CLEANUP_INTERVAL_MINUTES: ${AUTH_LOG_CLEANUP_INTERVAL_MINUTES:-60}
      EMAIL_VERIFY_TOKEN_TTL_HOURS: ${EMAIL_VERIFY_TOKEN_TTL_HOURS:-72}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_PROVIDER: ${SMTP_PROVIDER:-gmail}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-BioPlatform}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost.localhost}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-./uploads}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      B2_APPLICATION_KEY_ID: ${B2_APPLICATION_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_BUCKET_ID: ${B2_BUCKET_ID:-}
      B2_PREFIX: ${B2_PREFIX:-}
      B2_API_URL: ${B2_API_URL:-https://api.backblazeb2.com}
      STORAGE_COMPRESS_ENABLED: ${STORAGE_COMPRESS_ENABLED:-true}
      MEDIA_CACHE_MAX_AGE_HOURS: ${MEDIA_CACHE_MAX_AGE_HOURS:-168}
      MEDIA_CACHE_MAX_ENTRIES: ${MEDIA_CACHE_MAX_ENTRIES:-2000}
      MEDIA_CACHE_MAX_SIZE_MB: ${MEDIA_CACHE_MAX_SIZE_MB:-512}
      ORPHAN_CLEANUP_ENABLED: ${ORPHAN_CLEANUP_ENABLED:-true}
      ORPHAN_CLEANUP_INTERVAL_MINUTES: ${ORPHAN_CLEANUP_INTERVAL_MINUTES:-360}
      ORPHAN_CLEANUP_GRACE_HOURS: ${ORPHAN_CLEANUP_GRACE_HOURS:-24}
      MEDIA_PROXY_ENABLED: ${MEDIA_PROXY_ENABLED:-true}
      MEDIA_PROXY_MAX_BYTES: ${MEDIA_PROXY_MAX_BYTES:-20971520}
      MEDIA_PROXY_TTL_HOURS: ${MEDIA_PROXY_TTL_HOURS:-24}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:80}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-BioPlatform}
      PASSKEY_RESIDENCY_TTL_DAYS: ${PASSKEY_RESIDENCY_TTL_DAYS:-14}
      ADMIN_FLAG_USERS_WITHOUT_PASSKEYS: ${ADMIN_FLAG_USERS_WITHOUT_PASSKEYS:-true}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_INVITE: ${DISCORD_GUILD_INVITE:-}
      ACME_ENABLED: ${ACME_ENABLED:-false}
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_RENEW_BEFORE_DAYS: ${ACME_RENEW_BEFORE_DAYS:-30}
      ACME_INTERVAL_MINUTES: ${ACME_INTERVAL_MINUTES:-60}
      ACME_MAX_DOMAINS_PER_RUN: ${ACME_MAX_DOMAINS_PER_RUN:-20}
      ACME_CERTS_PATH: ${ACME_CERTS_PATH:-/app/certs}
      CUSTOM_DOMAINS_ALL_TIERS: ${CUSTOM_DOMAINS_ALL_TIERS:-false}
      AFFILIATE_INVITEE_DISCOUNT_PERCENT: ${AFFILIATE_INVITEE_DISCOUNT_PERCENT:-10}
      AFFILIATE_DISCOUNT_DURATION_DAYS: ${AFFILIATE_DISCOUNT_DURATION_DAYS:-365}
      AFFILIATE_DISCOUNT_LEVELS: ${AFFILIATE_DISCOUNT_LEVELS:-}
      AFFILIATE_ALLOWANCE_LEVELS: ${AFFILIATE_ALLOWANCE_LEVELS:-}
      AFFILIATE_BADGE_LEVELS: ${AFFILIATE_BADGE_LEVELS:-}
      AFFILIATE_ABUSE_ACTION: ${AFFILIATE_ABUSE_ACTION:-reject}
      AFFILIATE_ABUSE_SCOPE: ${AFFILIATE_ABUSE_SCOPE:-both}
      BILLING_MODE: ${BILLING_MODE:-one-time}
      BILLING_PRICE_PRO_CENTS: ${BILLING_PRICE_PRO_CENTS:-500}
      BILLING_PRICE_ENTERPRISE_CENTS: ${BILLING_PRICE_ENTERPRISE_CENTS:-2900}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-USD}
      # Paid invite credits. The packs variable is EMPTY by default on purpose:
      # a store with no prices can never open, so shipping a default price would
      # sell invites for an amount nobody chose. Also forwarded in
      # docker-compose.prebuilt.yml.
      INVITE_PRICE_PACKS: ${INVITE_PRICE_PACKS:-}
      INVITE_PURCHASE_CODE_TTL_DAYS: ${INVITE_PURCHASE_CODE_TTL_DAYS:-30}
      # Policy / legal notice behaviour. Forwarded in BOTH compose files: the
      # consent gate is what keeps an out-of-date account out of the API, so an
      # operator has to be able to see and change these without rebuilding an image.
      POLICY_NOTICE_AUTO_EMAIL: ${POLICY_NOTICE_AUTO_EMAIL:-true}
      # Operator accounts are auto-recorded as accepting each new policy version —
      # but only after the same 30-day review window everyone else gets. Without
      # this, bumping POLICY_VERSIONS locks the admin account out of the panel it
      # administers. "false" makes staff click through like any other account.
      POLICY_ADMIN_AUTO_ACCEPT: ${POLICY_ADMIN_AUTO_ACCEPT:-true}
      # Which role slugs count as operator accounts. Defaults to the single built-in
      # admin role; widening it to a broad staff list is a deliberate decision.
      POLICY_ADMIN_AUTO_ACCEPT_ROLES: ${POLICY_ADMIN_AUTO_ACCEPT_ROLES:-admin}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_ENABLED: ${PAYPAL_ENABLED:-false}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      CRYPTO_ENABLED: ${CRYPTO_ENABLED:-false}
      CRYPTO_PROVIDERS: ${CRYPTO_PROVIDERS:-btcpayserver}
      BTCPAY_URL: ${BTCPAY_URL:-}
      BTCPAY_API_KEY: ${BTCPAY_API_KEY:-}
      BTCPAY_STORE_ID: ${BTCPAY_STORE_ID:-}
      BTCPAY_WEBHOOK_SECRET: ${BTCPAY_WEBHOOK_SECRET:-}
      BITPAY_API_KEY: ${BITPAY_API_KEY:-}
      BITPAY_WEBHOOK_SECRET: ${BITPAY_WEBHOOK_SECRET:-}
      CRYPTO_COINS: ${CRYPTO_COINS:-BTC,LTC,XMR}
      CRYPTO_RATE_SOURCE: ${CRYPTO_RATE_SOURCE:-coingecko}
      CRYPTO_RATE_FALLBACK: ${CRYPTO_RATE_FALLBACK:-}
      CRYPTO_RATE_CACHE_SECONDS: ${CRYPTO_RATE_CACHE_SECONDS:-300}
      SSO_GOOGLE_CLIENT_ID: ${SSO_GOOGLE_CLIENT_ID:-}
      SSO_GOOGLE_CLIENT_SECRET: ${SSO_GOOGLE_CLIENT_SECRET:-}
      SSO_GITHUB_CLIENT_ID: ${SSO_GITHUB_CLIENT_ID:-}
      SSO_GITHUB_CLIENT_SECRET: ${SSO_GITHUB_CLIENT_SECRET:-}
      SSO_DISCORD_CLIENT_ID: ${SSO_DISCORD_CLIENT_ID:-}
      SSO_DISCORD_CLIENT_SECRET: ${SSO_DISCORD_CLIENT_SECRET:-}
      SSO_CALLBACK_URL: ${SSO_CALLBACK_URL:-}
      SSO_SIGNUP_REQUIRES_INVITE: ${SSO_SIGNUP_REQUIRES_INVITE:-true}
      SSO_2FA_BYPASS_ALLOWED: ${SSO_2FA_BYPASS_ALLOWED:-false}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-none}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-none}
      ANALYTICS_MATOMO_URL: ${ANALYTICS_MATOMO_URL:-}
      ANALYTICS_MATOMO_SITE_ID: ${ANALYTICS_MATOMO_SITE_ID:-0}
      POCKETBASE_URL: ${POCKETBASE_URL:-}
      POCKETBASE_CLIENT_URL: ${POCKETBASE_CLIENT_URL:-/api/pb-speed}
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-}
      POCKETBASE_AUTH_COLLECTION: ${POCKETBASE_AUTH_COLLECTION:-users}
      POCKETBASE_OAUTH_ENABLED: ${POCKETBASE_OAUTH_ENABLED:-false}
      LINKS_SECTIONS_ENABLED: ${LINKS_SECTIONS_ENABLED:-false}
      LINKS_CUSTOM_ICONS_ENABLED: ${LINKS_CUSTOM_ICONS_ENABLED:-false}
      LINKS_QR_ENABLED: ${LINKS_QR_ENABLED:-false}
      NEWSLETTER_PROVIDER: ${NEWSLETTER_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      NEWSLETTER_UNSUBSCRIBE_TTL_DAYS: ${NEWSLETTER_UNSUBSCRIBE_TTL_DAYS:-365}
      NEWSLETTER_MAILING_ADDRESS: ${NEWSLETTER_MAILING_ADDRESS:-}
      NEWSLETTER_SELF_RECIPIENT_CAP: ${NEWSLETTER_SELF_RECIPIENT_CAP:-1000}
      NEWSLETTER_PLATFORM_SMTP_ENABLED: ${NEWSLETTER_PLATFORM_SMTP_ENABLED:-false}
      NEWSLETTER_PLATFORM_RECIPIENT_CAP: ${NEWSLETTER_PLATFORM_RECIPIENT_CAP:-100}
      PRODUCT_FILE_MAX_MB: ${PRODUCT_FILE_MAX_MB:-50}
      PRODUCT_DOWNLOAD_TTL_HOURS: ${PRODUCT_DOWNLOAD_TTL_HOURS:-168}
      PRODUCT_PURCHASE_TOKEN_TTL_DAYS: ${PRODUCT_PURCHASE_TOKEN_TTL_DAYS:-30}
    volumes:
      - uploads_data:/app/uploads
      - ${CERTS_DIR:-./certs}:/app/certs
      # Operator-editable instance config (copy config.yml.example first; the
      # mount must be writable so hot reload can bump the file's mtime).
      - ./config.yml:/app/config.yml
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
      - "[::1]:${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # PocketBase is deliberately NOT a dependency: it is profiled out of the
      # main stack and the backend bootstrap fails soft when it is unreachable.

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-BioPlatform}
      VITE_APP_TAGLINE: ${VITE_APP_TAGLINE:-Your digital identity, beautifully crafted.}
      VITE_APP_DESCRIPTION: ${VITE_APP_DESCRIPTION:-Create a stunning profile page that showcases who you are. Links, music, themes, and more — all in one place.}
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:80}
      VITE_APP_GITHUB_URL: ${VITE_APP_GITHUB_URL:-https://github.com/00kino547/BioPlatform}
      VITE_APP_OG_IMAGE: ${VITE_APP_OG_IMAGE:-http://localhost:80/og.png}
      VITE_CONTACT_URL: ${VITE_CONTACT_URL:-https://github.com/00kino547/BioPlatform/issues}
      VITE_STATUS_URL: ${VITE_STATUS_URL:-}
      VITE_DOCS_URL: ${VITE_DOCS_URL:-https://github.com/00kino547/BioPlatform/tree/main/docs}
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      TLS_MODE: ${TLS_MODE:-development}
      SEND_HSTS_ON_DEV: ${SEND_HSTS_ON_DEV:-false}
      CF_TRUSTED_IPS: ${CF_TRUSTED_IPS:-172.16.0.0/12,127.0.0.1,::1}
      APP_URL_HOST: ${APP_URL_HOST:-}
      # When set, nginx generates a virtual host for this hostname that proxies
      # to the (optional) weblate container:8080, so the same Cloudflare Tunnel
      # that fronts the app also fronts Weblate. Empty = no Weblate vhost.
      WEBLATE_SITE_DOMAIN: ${WEBLATE_SITE_DOMAIN:-}
    ports:
      - "127.0.0.1:${NGINX_PORT:-80}:80"
      - "[::1]:${NGINX_PORT:-80}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-443}:443"
      - "[::1]:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # Host paths are parameterised so two instances on one host do not share
      # one ./nginx and one ./certs. Relative defaults keep the documented
      # single-instance layout exactly as it was.
      - ${NGINX_CONFIG_DIR:-./nginx}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_CONFIG_DIR:-./nginx}/site.conf:/etc/nginx/custom/site.conf:ro
      - ${NGINX_CONFIG_DIR:-./nginx}/entrypoint.sh:/entrypoint.sh:ro
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs
    depends_on:
      - frontend
      - backend
    profiles:
      - nginx

volumes:
  postgres_data:
  uploads_data:
  pb_data:
  # Weblate's own data (cloned repos, uploaded screenshots, generated secrets)
  # and its dedicated database. Kept separate from the application volumes so a
  # Weblate backup/restore is independent of the app's Postgres data.
  weblate_data:
  weblate_postgres_data:

networks:
  default:
    # Parameterised so a second stack on the same host does not silently JOIN the
    # first one, where the `postgres`/`redis` DNS aliases already resolve to the
    # live instance's containers. Give each deployment its own NETWORK_NAME, or
    # run each in its own directory, where the compose project name separates it.
    name: ${NETWORK_NAME:-bioplatform_net}
